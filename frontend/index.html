<!DOCTYPE html>
<html>
<body>
    <h1>Frontend</h1>
    <p id="output">Loading...</p>

    <script>
        fetch("http://backend:5000/api/message")
            .then(response => response.json())
            .then(data => {
                document.getElementById("output").innerHTML = data.message;
            });
    </script>
</body>
</html>
